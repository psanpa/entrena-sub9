// Identificar únicamente parejas inequívocas: un registro importado de Polar
// y una sesión manual o planificada de la MISMA fecha y deporte.
// Si dos sesiones tienen distancias o duraciones reales incompatibles,
// se consideran entrenamientos distintos y no se ofrecen para fusionar.
function polarDuplicatePairs(){
 const pairs=[];
 for(const incoming of db.workouts.filter(w=>w.polarSourceId&&['run','swim'].includes(w.type))){
  const opts=db.workouts.filter(w=>w.id!==incoming.id&&w.date===incoming.date&&w.type===incoming.type&&!w.polarSourceId);
  if(opts.length!==1)continue;
  const target=opts[0], a=target.cardio||{}, b=incoming.cardio||{};
  const ad=nz(a.distance),bd=nz(b.distance),ta=parseTime(a.duration),tb=parseTime(b.duration);
  if(ad>0&&bd>0&&Math.abs(ad-bd)>(incoming.type==='swim'?50:0.05))continue;
  if(ta>0&&tb>0&&Math.abs(ta-tb)>90)continue;
  pairs.push({targetId:target.id,sourceId:incoming.id,date:incoming.date,kind:incoming.type,targetTitle:target.title,sourceTitle:incoming.title});
 }
 return pairs;
}
function reconcilePolarPair(a,b){
 // Conservar el ID de la sesión planificada, sus ejercicios de piscina y sus objetivos.
 a.cardio=a.cardio||{};const other=b.cardio||{};
 for(const k of ['distance','duration','avgHr','maxHr']){
  if(other[k]!==undefined&&other[k]!==null&&other[k]!==''&&((k==='duration'&&parseTime(other[k])>0)||(k!=='duration'&&num(other[k])!==null&&num(other[k])>0))){a.cardio[k]=other[k];}
 }
 a.cardio.zoneMins=a.cardio.zoneMins||{};
 for(const [k,v] of Object.entries(other.zoneMins||{}))if(/^Z[1-6]$/.test(k)&&num(v)!==null)a.cardio.zoneMins[k]=v;
 a.polarSourceId=b.polarSourceId;
 if(b.polarSport!==undefined)a.polarSport=b.polarSport;
 a.done=true;
 a.doneSource='polar';
 a.completedAt=a.completedAt||b.completedAt||new Date().toISOString();
 if(b.note&&!(a.note||'').includes(b.note))a.note=[a.note,b.note].filter(Boolean).join('\n');
 // No sustituimos la lista de ejercicios del profesor, intervalos ni marcas personales.
}
function reviewPolarDuplicates(){
 const pairs=polarDuplicatePairs();
 if(!pairs.length){toast('No hay parejas de entrenamientos Polar y planificados para unificar.');return;}
 const detail=pairs.slice(0,12).map(x=>`${fmtDate(x.date)} · ${typeLabel(x.kind)}: ${x.targetTitle} + ${x.sourceTitle}`).join('\n');
 if(!confirm(`He detectado ${pairs.length} posible(s) duplicado(s) de Polar.\n\n${detail}${pairs.length>12?'\n...':''}\n\nSe conservará la sesión planificada, se añadirán sus métricas Polar y se eliminará la tarjeta importada repetida. Se conservarán las anotaciones y ejercicios manuales.\n\nAntes de aceptar, exporta una copia JSON en Datos. ¿Unificar estas sesiones?`))return;
 let merged=0;
 for(const pair of pairs){
  const a=db.workouts.find(w=>w.id===pair.targetId),b=db.workouts.find(w=>w.id===pair.sourceId);
  if(!a||!b||!b.polarSourceId||a.polarSourceId)continue;
  reconcilePolarPair(a,b);
  db.workouts=db.workouts.filter(w=>w.id!==b.id);
  merged++;
 }
 if(merged){persist();render();toast(`${merged} pareja(s) unificada(s). Comprueba ☁ Nube hasta ver ✓ Sincronizado.`);}
}

function newPolar(date=today()){let p=(db.polar||[]).find(x=>x.date===date);if(p)return editPolar(p.id);editingPolar=newPolarRecord(date);renderPolarModal();}
function editPolar(recordId){let p=(db.polar||[]).find(x=>x.id===recordId);if(!p)return toast('No se ha encontrado la lectura.',true);editingPolar=clone(p);if(!editingPolar.zoneMins)editingPolar.zoneMins={};renderPolarModal();}
function renderPolarModal(){let p=editingPolar;if(!p)return;let exists=(db.polar||[]).some(x=>x.id===p.id),ratio=polarRatio(p);
 openModal(`<div class="dialogheader"><div><div class="meta">Seguimiento Polar</div><div class="dialogtitle">♥ ${exists?'Editar':'Añadir'} lectura diaria</div></div><button class="small icononly" data-action="close-modal" type="button">✕</button></div><div class="dialogbody">

 <h3 style="margin:20px 0 12px">Carga cardiovascular</h3><div class="grid3">${field('Carga Polar','load',p.load,'number','min="0" step="0.1"')}${field('Esfuerzo','effort',p.effort,'number','min="0" step="0.1"')}${field('Tolerancia','tolerance',p.tolerance,'number','min="0" step="0.1"')}</div>

 <h3 style="margin:20px 0 12px">Recuperación, descanso y peso</h3><div class="grid3">${field('FC mínima nocturna (lpm)','nightHr',p.nightHr,'number','min="0" max="240" step="1"')}${field('Variabilidad cardíaca HRV (ms)','hrv',p.hrv,'number','min="0" step="0.1"')}${field('Horas de sueño','sleepHours',p.sleepHours,'number','min="0" max="24" step="0.1"')}${field('Puntuación sueño (0–100)','sleepScore',p.sleepScore,'number','min="0" max="100" step="1"')}${field('Peso corporal (kg)','bodyWeight',p.bodyWeight,'number','min="0" max="500" step="0.1"')}</div>
 <h3 style="margin:20px 0 12px">Minutos en cada zona Polar</h3><div class="grid3">${POLAR_ZONES.map(z=>field(z+' (min)','zoneMins.'+z,p.zoneMins?.[z],'number','min="0" step="0.1"')).join('')}</div><p class="help">Si has apuntado estos mismos minutos en una sesión de carrera, aquí se mostrarán por separado para no contarlos dos veces.</p>
 ${area('Observaciones de recuperación, sueño o fatiga','notes',p.notes,3)}</div>
 <div class="dialogfoot"><div class="row">${exists?'<button class="small danger" type="button" data-action="delete-polar">Eliminar</button>':''}<button class="small" type="button" data-action="close-modal">Cancelar</button></div><button class="primary" type="button" data-action="save-polar">✓ Guardar datos Polar</button></div>`,'polar',true);
}
function savePolar(){if(!editingPolar)return;let p=editingPolar;const dateOk=/^\d{4}-\d{2}-\d{2}$/.test(p.date)&&Number.isFinite(asDate(p.date).getTime());if(!dateOk)return toast('Fecha Polar no válida.',true);
 const fields=['load','effort','tolerance','nightHr','hrv','sleepHours','sleepScore','bodyWeight'];for(const k of fields){let x=num(p[k]);if(x!==null&&(x<0||!Number.isFinite(x)))return toast('Corrige el valor: '+k,true);}if(num(p.sleepHours)>24||num(p.sleepScore)>100)return toast('Revisa las horas y la puntuación del sueño.',true);
 const other=(db.polar||[]).find(x=>x.date===p.date&&x.id!==p.id);if(other)return toast('Ya tienes datos Polar para esta fecha: edita ese registro desde el historial.',true);
 db.polar??=[];let idx=db.polar.findIndex(x=>x.id===p.id);
 if(idx>=0&&Array.isArray(p.importedFields)){
  // Al corregir un valor manualmente, deja de actualizarse desde Polar automáticamente.
  const previous=db.polar[idx];p.importedFields=p.importedFields.filter(k=>JSON.stringify(previous[k])===JSON.stringify(p[k]));
 }
 if(idx>=0)db.polar[idx]=clone(p);else db.polar.push(clone(p));if(!persist())return;closeModal();render();toast('Lectura Polar guardada. La gráfica ya está actualizada.');
}

let modalMode=null;
function field(label,path,value='',type='text',extra=''){
 const v=value===null||value===undefined?'':value;
 return `<div class="formfield"><label>${esc(label)}</label><input type="${type}" data-path="${esc(path)}" value="${esc(v)}" ${extra}></div>`;
}
function area(label,path,value='',rows=2){return `<div class="formfield"><label>${esc(label)}</label><textarea rows="${rows}" data-path="${esc(path)}">${esc(value??'')}</textarea></div>`;}
function selectField(label,path,value,opts){return `<div class="formfield"><label>${esc(label)}</label><select data-path="${esc(path)}">${opts.map(([v,n])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`;}

function setNested(obj,path,value){let parts=path.split('.'),p=obj;for(let i=0;i<parts.length-1;i++){if(p[parts[i]]==null)p[parts[i]]={};p=p[parts[i]];}p[parts.at(-1)]=value;}
function handleFormChange(el){
 if(!el.dataset.path)return;
 if(modalMode==='workout'&&!draft||modalMode==='meso'&&!editingMeso||modalMode==='polar'&&!editingPolar||modalMode==='body'&&!editingBody)return;
 let path=el.dataset.path;let value=el.type==='checkbox'?el.checked:el.type==='number'?num(el.value):el.value;
 if(modalMode==='workout'){
  if(path==='type'&&value!==draft.type){let keep={date:draft.date,note:draft.note,wellbeing:draft.wellbeing};let updated=newWorkout(draft.date,value,mesoByDate(draft.date)?.id||null);updated.id=draft.id;updated.date=keep.date;updated.wellbeing=keep.wellbeing;updated.note=keep.note;updated.done=draft.done;draft=updated;renderWorkoutModal();return;}
  setNested(draft,path,value);
  if(el.type==='checkbox'&&/^(exercises|drills)\.\d+\.completed$/.test(path)){renderWorkoutModal();return;}
 }else if(modalMode==='meso'){setNested(editingMeso,path,value)}else if(modalMode==='polar'){setNested(editingPolar,path,value)}else if(modalMode==='body'){setNested(editingBody,path,value)}
}
function ensureValid(w){if(!/^\d{4}-\d{2}-\d{2}$/.test(w.date)||!Number.isFinite(asDate(w.date).getTime()))return 'Fecha no válida';
 if(w.type==='gym'){for(const e of w.exercises||[]){if(!e.name?.trim())return 'Cada ejercicio de gimnasio necesita nombre.';for(const s of e.sets||[])for(const k of ['plannedKg','plannedReps','actualKg','actualReps','rir'])if(s[k]!=null&&s[k]<0)return 'No se permiten pesos o repeticiones negativos.';}}
 if(w.type==='swim'){for(const d of w.drills||[]){if(nz(d.distanceActual)<0||nz(d.distancePlan)<0)return 'La distancia de piscina no puede ser negativa.';}}
 return null;}
function saveWorkout(completed){
 if(!draft)return;const err=ensureValid(draft);if(err)return toast(err,true);
 draft.mesoId=mesoByDate(draft.date)?.id||null;
 if(draft.type==='gym'){
  const p=gymProgress(draft);
  if(completed&&p.total>0&&!p.all&&
     !confirm(`Has marcado ${p.done} de ${p.total} ejercicios. ¿Finalizar el gimnasio igualmente como sesión parcial?`))return;
  if(!completed&&!draft.done&&p.all)draft.done=true;
 }
 if(completed)draft.done=true;
 if(draft.done){draft.completedAt=draft.completedAt||new Date().toISOString();if(!draft.polarSourceId)draft.doneSource='manual';}
 else {draft.completedAt=null;if(!draft.polarSourceId)draft.doneSource=null;}
 const i=db.workouts.findIndex(x=>x.id===draft.id);if(i>=0)db.workouts[i]=clone(draft);else db.workouts.push(clone(draft));
 if(!persist())return;const wasDone=draft.done;closeModal();render();toast(wasDone?'✓ Entrenamiento realizado y guardado.':'Progreso guardado; la sesión sigue pendiente.');
}
function openMesoEditor(m){editingMeso=m?clone(m):{id:id(),title:`M${db.mesocycles.length+1} · Nuevo mesociclo`,start:addDays(db.mesocycles.reduce((s,x)=>x.end>s?x.end:s,today()),1),end:'',phase:'Personalizado',description:''};if(!editingMeso.end)editingMeso.end=addDays(editingMeso.start,27);renderMesoModal();}
function renderMesoModal(){const m=editingMeso;if(!m)return;

function saveMeso(){const m=editingMeso;if(!m.title?.trim()||!/^\d{4}-\d{2}-\d{2}$/.test(m.start)||!/^\d{4}-\d{2}-\d{2}$/.test(m.end)||m.end<m.start)return toast('Revisa el nombre y las fechas del mesociclo.',true);
 if(diffDays(m.start,m.end)>180&&!confirm('Este bloque tiene más de 180 días. ¿Quieres guardarlo igualmente?'))return;
 const i=db.mesocycles.findIndex(x=>x.id===m.id);if(i>=0){const old=db.mesocycles[i],delta=diffDays(old.start,m.start),move=$('movePending')?.checked;
  if(move&&delta){db.workouts.filter(w=>w.mesoId===m.id&&!w.done).forEach(w=>{w.date=addDays(w.date,delta)})}

 }else db.mesocycles.push(clone(m));

function freshWorkout(w,date,mesoId){let a=clone(w);a.id=id();a.date=date;a.mesoId=mesoId;a.done=false;a.effort=null;a.note='';a.wellbeing='Óptimo';a.cardio={...a.cardio,distance:null,duration:'',avgHr:null,maxHr:null,zoneMins:{Z1:null,Z2:null,Z3:null,Z4:null,Z5:null,Z6:null}};
 a.exercises=(a.exercises||[]).map(ex=>({...ex,id:id(),sets:ex.sets.map(s=>({...s,actualKg:null,actualReps:null,rir:null}))}));a.intervals=(a.intervals||[]).map(x=>({...x,id:id(),actualTime:''}));a.drills=(a.drills||[]).map(x=>({...x,id:id(),distanceActual:null,time:'',notes:''}));a.tests={run2k:'',pushups:null,plank:'',agility:'',swim50:''};return a;}
function cloneMeso(m){let newStart=addDays(m.end,1),delta=diffDays(m.start,newStart),copy={...clone(m),id:id(),title:m.title+' · copia',start:newStart,end:addDays(m.end,delta)};
 db.mesocycles.push(copy);db.workouts.filter(w=>w.mesoId===m.id).forEach(w=>db.workouts.push(freshWorkout(w,addDays(w.date,delta),copy.id)));db.mesocycles.sort((a,b)=>a.start.localeCompare(b.start));selectedMeso=copy.id;selectedWeek=0;persist();render();toast('Mesociclo duplicado (sin marcas reales).');}
function templateWorkout(date,m){let wd=asDate(date).getDay(),v;
 if([1,3,5].includes(wd)){v=newWorkout(date,'swim',m.id);v.title=wd===5?'Piscina libre · técnica y 50 m':'Piscina dirigida · ejercicios del profesor';v.teacher=wd===5?'Sesión personal':'Clase dirigida';v.cardio.plannedDistance=wd===5?500:750;}
 else if(wd===2){v=newWorkout(date,'gym',m.id);v.title='Gimnasio · fuerza completa';}
 else if(wd===4){v=newWorkout(date,'run',m.id);v.title='Series de carrera';const midx=db.mesocycles.findIndex(x=>x.id===m.id),ix=Math.max(0,Math.min(7,midx)),opts=[[0,0,''],[6,400,'1:50'],[5,500,'2:15'],[4,600,'2:39'],[4,800,'3:35'],[3,1000,'4:35'],[6,400,'1:47'],[0,0,'']][ix];if(opts[0])v.intervals=Array.from({length:opts[0]},()=>({id:id(),distance:opts[1],plannedTime:opts[2],actualTime:'',restSec:90}));else{v.title=ix===7?'Test / simulación 2 km':'Carrera Z2 · base';v.cardio.plannedDistance=ix===7?2:5;}}
 else if(wd===6){v=newWorkout(date,'run',m.id);v.title='Rodaje continuo Z2';v.cardio.plannedDistance=7;v.cardio.plannedPace='6:30–7:00/km';}
 else {v=newWorkout(date,'other',m.id);v.title='Descanso · movilidad';}
 return v;
}
function fillMeso(m){let total=0;for(let d=m.start;d<=m.end;d=addDays(d,1)){if(!workoutsByDate(d).length){db.workouts.push(templateWorkout(d,m));total++;}if(total>183)break;}persist();render();toast(total?`${total} días añadidos con la plantilla editable.`:'Ya hay actividades en todos los días.');}

function saveBlob(name,mime,data){const blob=new Blob([data],{type:mime});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);}
function csv(rows){const escapeCell=x=>{let s=String(x??'');if(/^[\s]*[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};return '\ufeff'+rows.map(r=>r.map(escapeCell).join(';')).join('\r\n');}

 if(w.type==='swim')(w.drills||[]).forEach((d,i)=>r.push([w.date,'Piscina',w.title,d.name,i+1,'','','','','',d.distancePlan,d.distanceActual,d.time]));
 if(w.type==='run')(w.intervals||[]).forEach((s,i)=>r.push([w.date,'Carrera',w.title,'Serie',i+1,'','','','','',s.distance,s.distance,s.actualTime]));});saveBlob('EntrenaSUB9_series_y_piscina.csv','text/csv;charset=utf-8',csv(r));}

async function importJson(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.mesocycles)||!Array.isArray(x.workouts)||x.mesocycles.length>100||x.workouts.length>20000)throw new Error('Estructura o tamaño no válido');if(!x.mesocycles.every(m=>typeof m.id==='string'&&typeof m.start==='string'&&typeof m.end==='string')||!x.workouts.every(w=>typeof w.date==='string'&&['gym','run','swim','other','test'].includes(w.type)))throw new Error('Estructura de datos incompleta');if(!confirm('¿Sustituir toda la información actual con la copia seleccionada? SI ESTÁS CONECTADO A LA NUBE, estas sustituciones y eliminaciones se sincronizarán en otros dispositivos. Exporta primero una copia JSON.'))return;
 db={version:3,settings:x.settings||{},mesocycles:x.mesocycles,workouts:x.workouts,polar:Array.isArray(x.polar)?x.polar:[],body:Array.isArray(x.body)?x.body:[],createdAt:x.createdAt||new Date().toISOString()};selectedMeso=db.mesocycles[0]?.id;selectedWeek=0;persist();closeModal();setTab('panel');toast('Copia restaurada.');}catch(e){toast('No se pudo importar: '+e.message,true)}}

async function polarInvoke(action,rest={}){
 if(!sync.user||!sync.client)throw Error('Inicia sesión en ☁ Nube antes de conectar Polar.');
 const {data,error}=await sync.client.functions.invoke('dynamic-processor',{body:{action,...rest}});
 if(error){let message=error.message||'No se pudo conectar con la función de Polar.';
   try{const detail=await error.context?.json?.();message=detail?.error||message;}catch{}
   throw Error(message);
 }
 if(data?.error)throw Error(data.error);
 return data||{};
}

async function polarConnect(){
 if(polarRemote.busy||!sync.user)return;
 polarRemote.busy=true;polarRemote.error='';if(tab==='polarflow')render();
 try{
  const state=Array.from(crypto.getRandomValues(new Uint8Array(32)),v=>v.toString(16).padStart(2,'0')).join('');
  sessionStorage.setItem(POLAR_OAUTH_KEY,JSON.stringify({state,userId:sync.user.id,expires:Date.now()+15*60*1000}));
  const res=await polarInvoke('authorize',{state});
  if(!res.url||!res.url.startsWith('https://flow.polar.com/'))throw Error('Polar no devolvió una dirección válida.');
  location.assign(res.url);
 }catch(e){polarRemote.error=e.message;toast('No se pudo iniciar Polar: '+e.message,true);polarRemote.busy=false;if(tab==='polarflow')render();}
}

function applyPolarLaps(w,laps){
 // Se completan repeticiones solo cuando hay exactamente una vuelta compatible
 // por cada distancia prevista. No se inventan parciales a partir del promedio total.
 let intervals=w.intervals||[];if(!intervals.length||!Array.isArray(laps)||laps.length<intervals.length)return 0;
 let matching=laps.filter(l=>num(l.distanceMeters)>0&&num(l.durationSec)>0&&intervals.some(s=>{
  const planned=num(s.distance);return planned>0&&Math.abs(planned-l.distanceMeters)<=Math.max(12,planned*0.07);
 }));
 if(matching.length!==intervals.length)return 0;
 let used=new Set(),matched=[];
 for(let s of intervals){let i=matching.findIndex((l,ix)=>!used.has(ix)&&Math.abs(l.distanceMeters-s.distance)<=Math.max(12,s.distance*0.07));
  if(i<0)return 0;used.add(i);matched.push(matching[i]);
 }
 let changed=0;intervals.forEach((s,i)=>{
  if(parseTime(s.actualTime)>0)return;
  s.actualTime=timeFmt(matched[i].durationSec);s.actualDistance=Math.round(matched[i].distanceMeters*10)/10;s.polarLap=true;changed++;
 });
 return changed;
}

function polarMerge(data){
 const summary={newDaily:0,updatedDaily:0,newWorkouts:0,filledPlanned:0,existingWorkouts:0};
 let changed=false;
 for(const p of data.daily||[]){
  if(!/^\d{4}-\d\d-\d\d$/.test(p.date))continue;
  let x=db.polar.find(q=>q.date===p.date);
  if(!x){x=newPolarRecord(p.date);x.source='Polar Flow';db.polar.push(x);summary.newDaily++;changed=true;}
  let filled=false;
  const fields=['load','effort','tolerance','hrv','sleepHours','sleepScore','nightlyRechargeStatus','nightAvgHr',
   'steps','activityPercent','caloriesTotal','caloriesActive','inactivityAlerts','distanceStepsKm',
   'activeMinutes','inactiveMinutes','sleepLightMin','sleepDeepMin','sleepRemMin','sleepUnrecognizedMin',
   'sleepInterruptMin','sleepShortInterruptMin','sleepLongInterruptMin','sleepGoalMin','sleepContinuity',
   'sleepCycles','sleepCharge','sleepRating','ansCharge','ansChargeStatus','breathingRateAvg'];
  x.importedFields=Array.isArray(x.importedFields)?x.importedFields:[];
  for(const key of fields){const v=num(p[key]);if(v===null)continue;
   const wasImported=x.importedFields.includes(key)||(x.source==='Polar Flow'&&x[key]!=null);
   if(x[key]==null||wasImported){if(x[key]!==v){x[key]=v;filled=true;changed=true;}if(!x.importedFields.includes(key)){x.importedFields.push(key);changed=true;}}
  }
  for(const key of ['sleepStartTime','sleepEndTime']){
   if(typeof p[key]==='string' && (x[key]==null||x.importedFields.includes(key)||x.source==='Polar Flow')){
    if(x[key]!==p[key]){x[key]=p[key];filled=true;changed=true;}if(!x.importedFields.includes(key)){x.importedFields.push(key);changed=true;}
   }
  }
  if(filled&&x.source!=='Polar Flow')summary.updatedDaily++;
 }

 for(const p of data.exercises||[]){
  if(!p.sourceId||!/^\d{4}-\d\d-\d\d$/.test(p.date))continue;
  let existing=db.workouts.find(w=>w.polarSourceId===p.sourceId);
  if(existing){
   if(p.kind==='run'&&Array.isArray(p.laps)&&p.laps.length&&JSON.stringify(existing.polarLaps||[])!==JSON.stringify(p.laps)){
    existing.polarLaps=clone(p.laps);applyPolarLaps(existing,p.laps);changed=true;
   }
   summary.existingWorkouts++;continue;
  }
  // Gimnasio se registra manualmente; no importar sesiones genéricas del reloj.
  if(!['run','swim'].includes(p.kind))continue;
  const t=p.kind;
  let candidates=db.workouts.filter(w=>w.date===p.date&&w.type===t&&!w.polarSourceId&&(!w.done||(!nz(w.cardio?.distance)&&!parseTime(w.cardio?.duration))));
  let match=candidates.length===1?candidates[0]:null;
  // Si hay varias actividades del mismo deporte, solo se elige una cuando
  // existe una única planificación que coincide de forma inequívoca.
  if(!match&&candidates.length>1){
   const planned=candidates.filter(w=>w.mesoId&&w.cardio?.plannedDistance!=null);
   if(planned.length===1)match=planned[0];
  }
  if(!match){
   const similar=db.workouts.filter(w=>w.date===p.date&&w.type===t&&w.done&&!w.polarSourceId&&
    num(w.cardio?.distance)!==null&&p.distanceMeters>0&&
    Math.abs(nz(w.cardio.distance)-(t==='run'?p.distanceMeters/1000:p.distanceMeters)) <= (t==='run'?0.05:50)&&
    parseTime(w.cardio?.duration)>0&&p.durationSec>0&&Math.abs(parseTime(w.cardio.duration)-p.durationSec)<90);
   if(similar.length===1)match=similar[0];
  }
  let w=match||newWorkout(p.date,t,mesoByDate(p.date)?.id||null);
  if(!match){w.title='Polar · '+({'gym':'Gimnasio','run':'Carrera','swim':'Natación','other':'Entrenamiento'}[t]);w.exercises=[];db.workouts.push(w);summary.newWorkouts++;}
  else summary.filledPlanned++;
  w.polarSourceId=p.sourceId;w.polarSport=p.sport;
  if(t==='run'&&Array.isArray(p.laps)&&p.laps.length){w.polarLaps=clone(p.laps);applyPolarLaps(w,p.laps);}
  w.done=true;w.doneSource='polar';w.completedAt=w.completedAt||new Date().toISOString();
  w.cardio=w.cardio||{};
  if(p.durationSec>0){let seconds=Math.round(p.durationSec);w.cardio.duration=seconds>=3600?`${Math.floor(seconds/3600)}:${String(Math.floor(seconds%3600/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`:`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;}
  if(p.distanceMeters>0)w.cardio.distance=t==='swim'?Math.round(p.distanceMeters):Math.round(p.distanceMeters/1000*1000)/1000;
  if(p.avgHr!=null)w.cardio.avgHr=p.avgHr;
  if(p.maxHr!=null)w.cardio.maxHr=p.maxHr;
  w.cardio.zoneMins=w.cardio.zoneMins||{};
  for(const [z,v] of Object.entries(p.zoneMins||{}))if(/^Z[1-6]$/.test(z)&&num(v)!=null)w.cardio.zoneMins[z]=v;
  if(!w.note?.includes('Datos de Polar Flow'))w.note=(w.note? w.note+'\n':'')+'Datos de Polar Flow (sin modificar tus series de fuerza ni ejercicios de piscina).';
  changed=true;
 }
 if(changed)persist();
 return summary;
}
async function polarFetch(silent=false){
 if(polarRemote.busy||!sync.user||!navigator.onLine)return;
 polarRemote.busy=true;polarRemote.error='';polarRemote.summary='';if(tab==='polarflow')render();
 try{
  // Leer cambios de otros dispositivos antes de mezclar datos de Polar.
  if(!sync.busy)await syncNow();
  const data=await polarInvoke('pull');
  const counts=polarMerge(data);
  polarRemote.lastSync=data.fetchedAt||new Date().toISOString();polarRemote.warnings=data.warnings||[];polarRemote.connected=true;polarRemote.checked=true;
  polarRemote.summary=`Polar consultado: ${counts.newDaily} días nuevos de actividad/recuperación, ${counts.updatedDaily} días ampliados, ${counts.newWorkouts} entrenos añadidos y ${counts.filledPlanned} sesiones planificadas completadas. ${counts.existingWorkouts} entrenos ya existentes.`;
  localStorage.setItem(POLAR_LAST_KEY+':'+sync.user.id,String(Date.now()));
  if(!sync.busy)await syncNow();
  if(!silent)toast('Polar importado. Comprueba el estado de sincronización en ☁ Nube.');
 }catch(e){polarRemote.error='Error Polar Flow: '+e.message;if(!silent)toast(polarRemote.error,true);}
 finally{polarRemote.busy=false;if(tab==='polarflow')render();}
}
async function polarDisconnect(){
 if(!confirm('¿Desconectar Polar Flow? Los entrenamientos YA importados permanecerán en ENTRENA SUB9.'))return;
 polarRemote.busy=true;render();
 try{await polarInvoke('disconnect');polarRemote.connected=false;polarRemote.lastSync=null;polarRemote.summary='Polar desconectado. Los datos importados siguen guardados.';toast('Cuenta Polar desvinculada.');}
 catch(e){polarRemote.error=e.message;toast(e.message,true);}
 finally{polarRemote.busy=false;render();}
}
async function polarAuto(){
 if(!sync.user||!navigator.onLine||polarRemote.busy)return;
 const params=new URLSearchParams(location.search);
 if(params.has('state')){await polarCallback();return;}
 const last=Number(localStorage.getItem(POLAR_LAST_KEY+':'+sync.user.id)||0);
 if(Date.now()-last<60*60*1000)return;
 await polarStatus(true);
 if(polarRemote.connected)await polarFetch(true);
}

/* ===== ACCIONES DE INTERFAZ ===== */
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
$('quickNew').addEventListener('click',()=>newOnDate());
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalMode)closeModal()});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('#modalContent [data-path]'))handleFormChange(el);if(el.matches('#weekPlanView [data-plan-field], #weekPlanView [data-week-field]'))planFieldChange(el)});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.matches('#modalContent [data-path]'))handleFormChange(el);
 if(el.id==='calendarMeso'){selectedMeso=el.value;selectedWeek=0;render()}
 if(el.id==='weekPlanMeso'){selectedMeso=el.value;editingWeekPlan=null;editingWeekPlanMesoId=null;render()}

 if(el.id==='statExercise'){statExercise=el.value;render()}

 if(el.id==='polarRange'){polarRange=el.value;render()}

 if(el.id==='bodyMetric'){bodyMetric=el.value;render()}
 if(el.id==='legacyImport'){importLegacyFile(el.files?.[0]);el.value=''}
 if(el.id==='jsonImport'){importJson(el.files?.[0]);el.value=''}
});
document.addEventListener('click',e=>{
 const el=e.target.closest('button');if(!el)return;
 if(el.dataset.tab&&!el.closest('#nav')){setTab(el.dataset.tab);return;}
 const act=el.dataset.action;if(!act)return;
 const i=Number(el.dataset.i),j=Number(el.dataset.j),wd=()=>db.workouts.find(w=>w.id===el.dataset.id),md=()=>db.mesocycles.find(m=>m.id===el.dataset.id);
 switch(act){
 case 'new-today':newOnDate();break;
 case 'go-cloud':setTab('nube');break;
 case 'polar-status':polarStatus();break;
 case 'polar-connect':polarConnect();break;
 case 'polar-fetch':polarFetch();break;
 case 'polar-disconnect':polarDisconnect();break;
 case 'body-new':newBody();break;
 case 'body-edit':editBody(el.dataset.id);break;
 case 'body-save':saveBody();break;
 case 'body-delete':deleteBody();break;
 case 'body-csv':exportBodyCsv();break;
 case 'cloud-signup':cloudAuth('signup');break;
 case 'cloud-login':cloudAuth('login');break;
 case 'cloud-logout':cloudLogout(false);break;
 case 'cloud-logout-clear':cloudLogout(true);break;
 case 'cloud-sync':syncNow(true);break;
 case 'cloud-refresh':render();break;
 case 'conflict-local':resolveConflict(el.dataset.id,true);break;
 case 'conflict-remote':resolveConflict(el.dataset.id,false);break;
 case 'legacy-merge':mergeLegacy();break;
 case 'legacy-export':if(localStorage.getItem(V2_COPY))saveBlob('EntrenaSUB9_backup_v2.json','application/json',localStorage.getItem(V2_COPY));break;
 case 'new-polar':newPolar();break;
 case 'new-polar-on-date':newPolar(el.dataset.date);break;
 case 'edit-polar':editPolar(el.dataset.id);break;
 case 'save-polar':savePolar();break;
 case 'delete-polar':if(editingPolar&&confirm('¿Borrar la lectura Polar de '+fmtDate(editingPolar.date)+'?')){db.polar=db.polar.filter(p=>p.id!==editingPolar.id);persist();closeModal();render();toast('Registro Polar eliminado.')}break;
 case 'new-on-date':newOnDate(el.dataset.date);break;
 case 'edit-workout':openWorkout(el.dataset.id);break;
 case 'quick-complete':quickCompleteWorkout(el.dataset.id);break;
 case 'review-polar-duplicates':reviewPolarDuplicates();break;
 case 'close-modal':closeModal();break;
 case 'save-workout':saveWorkout(false);break;
 case 'finish-workout':saveWorkout(true);break;
 case 'delete-workout':if(draft&&confirm('¿Eliminar esta sesión y sus marcas? Esta acción no se puede deshacer.')){db.workouts=db.workouts.filter(w=>w.id!==draft.id);persist();closeModal();render();toast('Sesión eliminada.')}break;
 case 'add-exercise':if(!draft)return;draft.exercises.push(newExercise('Nuevo ejercicio'));renderWorkoutModal();break;
 case 'remove-exercise':if(draft&&confirm('¿Quitar este ejercicio con todas sus series?')){draft.exercises.splice(i,1);renderWorkoutModal();}break;
 case 'add-set':if(!draft?.exercises?.[i])return;{let ex=draft.exercises[i],p=ex.sets[ex.sets.length-1]||{};ex.sets.push({plannedKg:p.plannedKg??null,plannedReps:p.plannedReps??null,actualKg:null,actualReps:null,rir:null});renderWorkoutModal();}break;
 case 'remove-set':if(draft?.exercises?.[i]?.sets?.length>1){draft.exercises[i].sets.splice(j,1);renderWorkoutModal()}else toast('Un ejercicio debe tener al menos una serie.',true);break;
 case 'copy-gym-ex':if(draft?.exercises?.[i]){draft.exercises[i].sets.forEach(s=>{s.actualKg=s.plannedKg;s.actualReps=s.plannedReps});renderWorkoutModal();}break;
 case 'copy-gym-all':if(draft?.type==='gym'){draft.exercises.forEach(ex=>ex.sets.forEach(s=>{s.actualKg=s.plannedKg;s.actualReps=s.plannedReps}));renderWorkoutModal();}break;
 case 'add-interval':if(draft){draft.intervals.push({id:id(),distance:400,plannedTime:'',actualTime:'',restSec:90});renderWorkoutModal()}break;
 case 'remove-interval':if(draft){draft.intervals.splice(i,1);renderWorkoutModal()}break;
 case 'add-drill':if(draft){draft.drills??=[];draft.drills.push(newDrill('',null));renderWorkoutModal()}break;
 case 'remove-drill':if(draft){draft.drills.splice(i,1);renderWorkoutModal()}break;
 case 'pool-example':if(draft){if(draft.drills?.length&&!confirm('¿Añadir los bloques de ejemplo a los que ya tienes?'))return;const p=nz(draft.poolLength)||25;draft.drills??=[];[['Calentamiento · 6 largos',6],['Técnica pull buoy / patada · 6 largos',6],['Solo piernas · 4 largos',4],['Series rápidas · 6 largos',6],['Nado libre · 4 largos',4],['Continuo · 4 largos',4]].forEach(([name,laps])=>draft.drills.push(newDrill(name,laps*p)));renderWorkoutModal();}break;
 case 'sum-pool':if(draft){let actual=(draft.drills||[]).reduce((a,d)=>a+nz(d.distanceActual),0),plan=(draft.drills||[]).reduce((a,d)=>a+nz(d.distancePlan),0);if(actual<=0){toast('Primero introduce la distancia real de algún ejercicio.',true);return;}draft.cardio.distance=actual;if(plan>0)draft.cardio.plannedDistance=plan;renderWorkoutModal();toast('Distancias sumadas.');}break;
 case 'edit-meso':openMesoEditor(md());break;
 case 'add-meso':case 'new-meso':openMesoEditor(null);break;
 case 'save-meso':saveMeso();break;
 case 'delete-meso':if(editingMeso&&confirm('¿Eliminar el mesociclo? Sus sesiones permanecerán guardadas en el historial y en sus fechas originales.')){db.mesocycles=db.mesocycles.filter(x=>x.id!==editingMeso.id);db.workouts.filter(w=>w.mesoId===editingMeso.id).forEach(w=>w.mesoId=null);selectedMeso=db.mesocycles[0]?.id;persist();closeModal();render();toast('Mesociclo eliminado, sesiones conservadas.')}break;
 case 'select-meso':selectedMeso=el.dataset.id;selectedWeek=0;setTab('calendario');break;
 case 'clone-meso':if(md())cloneMeso(md());break;
 case 'fill-meso':if(md())fillMeso(md());break;
 case 'open-weekplan':selectedMeso=el.dataset.id||selectedMeso;editingWeekPlan=null;setTab('plansemana');break;
 case 'weekplan-add':planAddRow();break;
 case 'weekplan-remove':planRemoveRow(el.dataset.key);break;
 case 'weekplan-capture':planCaptureWeek();break;
 case 'weekplan-save':planSave(false);break;
 case 'weekplan-apply':planSave(true);break;
 case 'prev-meso':case 'next-meso':{const ix=db.mesocycles.findIndex(x=>x.id===selectedMeso)+(act==='prev-meso'?-1:1);if(db.mesocycles[ix]){selectedMeso=db.mesocycles[ix].id;selectedWeek=0;render()}break;}
 case 'toggle-week':weeklyView=el.dataset.view==='week';render();break;
 case 'week':selectedWeek=nz(el.dataset.week);render();break;
 case 'export-json':saveBlob('EntrenaSUB9_copia_'+today()+'.json','application/json;charset=utf-8',JSON.stringify(db,null,2));toast('Copia JSON preparada.');break;
 case 'import-json':$('jsonImport')?.click();break;
 case 'export-csv':exportCsv();break;
 case 'export-sets-csv':exportSetsCsv();break;
 case 'export-polar-csv':exportPolarCsv();break;
 case 'save-settings':db.settings??={};db.settings.goal2k=$('target2k')?.value||'9:00';db.settings.targetDate=$('targetDate')?.value||'';persist();render();toast('Objetivos actualizados.');break;
 case 'save-reference':db.settings??={};db.settings.reference={run2k:$('ref2k')?.value||'',pushups:num($('refPush')?.value),plank:$('refPlank')?.value||'',agility:$('refAgility')?.value||''};persist();toast('Referencias personales guardadas.');break;
 case 'reset-all':if(confirm('¿Restablecer todos los mesociclos y borrar TODAS tus marcas guardadas?'))if(confirm('Última confirmación: perderás lo que no hayas exportado. ¿Continuar?')){db=initialDB();selectedMeso=db.mesocycles[0].id;selectedWeek=0;persist();setTab('panel');toast('Plantilla restaurada.')}break;
 }
});
render();
initCloud();
